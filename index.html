<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="app-title">♟ Grandmaster AI</h1>
            <div class="controls-top">
                <button id="btn-new">New Game</button>
                <button id="btn-flip">Flip Board</button>
                <button id="btn-undo">Undo</button>
            </div>
        </header>
        
        <main>
            <div class="left-panel">
                <div class="board-container">
                    <div id="eval-bar-container" title="Evaluation Bar">
                        <div id="eval-bar-fill"></div>
                    </div>
                    <div id="board">
                        <div id="squares-layer"></div>
                        <svg id="arrows-svg" width="100%" height="100%"></svg>
                        <div id="pieces-layer"></div>
                    </div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="settings-card glass-panel">
                    <h3>⚙️ Setup & Analyze</h3>
                    <div class="setting-row">
                        <label>Play As:</label>
                        <div>
                            <input type="radio" id="play-w" name="play-as" value="w" checked> <label for="play-w" style="margin-right: 10px;">White</label>
                            <input type="radio" id="play-b" name="play-as" value="b"> <label for="play-b">Black</label>
                        </div>
                    </div>
                    <div class="setting-row">
                        <label title="Automatically play against the engine">Play vs AI:</label>
                        <input type="checkbox" id="play-vs-ai" style="width: 20px; height: 20px; cursor: pointer;">
                    </div>
                    <button id="btn-calculate" style="width: 100%; margin-bottom: 15px; background: var(--accent); color: #000; font-weight: bold; font-size: 1.1rem; padding: 12px; border: none; border-radius: 8px;">🚀 Calculate Best Move</button>
                    
                    <div class="setting-row">
                        <label>Engine:</label>
                        <select id="engine-select">
                            <option value="stockfish">Stockfish 16.1 (Max Strength)</option>
                            <option value="komodo">Komodo (Human-like)</option>
                            <option value="maia3">Maia3 (Neural Net Human Elos)</option>
                            <option value="lozza">Lozza</option>
                            <option value="wukong">Wukong</option>
                        </select>
                    </div>
                    
                    <div id="engine-advanced-settings" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                        <div class="setting-row">
                            <label>ELO: <span id="eloValue">1500</span></label>
                            <input type="range" id="elo" min="600" max="2600" step="100" value="1500" style="width: 120px;">
                        </div>
                        <div class="setting-row">
                            <label>Depth: <span id="depthValue">15</span></label>
                            <input type="range" id="depth" min="1" max="25" step="1" value="15" style="width: 120px;">
                        </div>
                        <div class="setting-row">
                            <label>Lines: <span id="linesValue">1</span></label>
                            <input type="range" id="lines" min="1" max="5" step="1" value="1" style="width: 120px;">
                        </div>
                    </div>
                    
                    <div class="setting-row" style="margin-top: 15px;">
                        <label>Style:</label>
                        <select id="style-select">
                            <option value="Default">Default</option>
                            <option value="Aggressive">Aggressive</option>
                            <option value="Defensive">Defensive</option>
                            <option value="Active">Active</option>
                            <option value="Positional">Positional</option>
                            <option value="Endgame">Endgame</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Human">Human</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Board Theme:</label>
                        <select id="theme-select">
                            <option value="green">Classic Green</option>
                            <option value="walnut">Premium Walnut</option>
                            <option value="slate">Sleek Slate</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Arrows:</label>
                        <input type="range" id="arrow-count" min="1" max="5" value="3">
                        <span id="arrow-count-val">3</span>
                    </div>
                    <div class="setting-row">
                        <label>Depth:</label>
                        <input type="range" id="depth-slider" min="10" max="25" value="18">
                        <span id="depth-val">18</span>
                    </div>
                    <div class="setting-row">
                        <label>Colors:</label>
                        <div class="color-pickers">
                            <input type="color" id="color-1" value="#3b82f6" title="Best Move">
                            <input type="color" id="color-2" value="#22c55e" title="2nd Best">
                            <input type="color" id="color-3" value="#eab308" title="3rd Best">
                        </div>
                    </div>
                </div>

                <div class="best-moves-card glass-panel">
                    <div class="card-header">
                        <h3>📊 Best Moves</h3>
                        <span id="analysis-time">⏱️ 0.0s</span>
                    </div>
                    <div id="best-moves-list">
                        <div style="color: #94a3b8; font-style: italic;">Awaiting moves...</div>
                    </div>
                </div>

                <div class="history-card glass-panel">
                    <div class="card-header">
                        <h3>📜 Move History</h3>
                        <button id="btn-export-pgn" style="font-size: 0.8rem; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: 0.2s;">📋 Copy PGN</button>
                    </div>
                    <div id="move-history"></div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="promotion-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel" style="text-align: center; padding: 25px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.5);">
            <h3 style="margin-top: 0; margin-bottom: 20px;">Promote Pawn</h3>
            <div class="promo-options" style="display: flex; gap: 15px; justify-content: center;">
                <button data-piece="q" class="promo-btn" style="font-size: 2rem; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #fff;">♕</button>
                <button data-piece="r" class="promo-btn" style="font-size: 2rem; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #fff;">♖</button>
                <button data-piece="b" class="promo-btn" style="font-size: 2rem; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #fff;">♗</button>
                <button data-piece="n" class="promo-btn" style="font-size: 2rem; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #fff;">♘</button>
            </div>
        </div>
    </div>
    
    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
